name: Build Yonetici Takip Prototype APK

on:
  push:
    branches: [ manager-prototype ]
    paths:
      - 'manager-prototype/**'
      - '.github/workflows/manager-prototype-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: manager-prototype
        run: gradle assembleRelease --no-daemon
      - name: Prepare artifact
        run: |
          cp manager-prototype/app/build/outputs/apk/release/app-release.apk YoneticiTakip-prototype.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YoneticiTakip-prototype
          path: YoneticiTakip-prototype.apk
      - name: Publish rolling prototype release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view manager-prototype-latest >/dev/null 2>&1 || \
            gh release create manager-prototype-latest --title "Yönetici Takip Prototype" --notes "Local-only prototype APK. No email or internet permission."
          gh release upload manager-prototype-latest YoneticiTakip-prototype.apk --clobber
