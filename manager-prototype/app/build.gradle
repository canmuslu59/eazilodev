plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eazilo.yoneticitakip'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eazilo.yoneticitakip'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.1-prototype'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
